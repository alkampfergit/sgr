name: Build and Pack NuGet

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      push-to-nuget:
        description: "Publish the generated package to NuGet.org"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-pack-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          base_version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' src/Alkampfer.Sgr/Alkampfer.Sgr.csproj | head -n 1)"

          if [[ -z "$base_version" ]]; then
            echo "::error::Unable to resolve <VersionPrefix> from src/Alkampfer.Sgr/Alkampfer.Sgr.csproj"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]]; then
            package_version="${BASH_REMATCH[1]}"
          else
            package_version="${base_version}-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "Using package version: $package_version"

      - name: Restore
        run: dotnet restore sgr.slnx

      - name: Build
        run: dotnet build sgr.slnx -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.version.outputs.package_version }}

      - name: Test
        run: dotnet test sgr.slnx -c Release --no-build

      - name: Pack library
        run: dotnet pack src/Alkampfer.Sgr/Alkampfer.Sgr.csproj -c Release --no-build -o artifacts/nuget /p:ContinuousIntegrationBuild=true /p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ steps.version.outputs.package_version }}
          path: artifacts/nuget/*
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: github.event_name == 'workflow_dispatch' && inputs['push-to-nuget'] == true
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "::error::The NUGET_API_KEY secret is required to publish packages."
            exit 1
          fi

          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

          shopt -s nullglob
          symbol_packages=(artifacts/nuget/*.snupkg)
          if (( ${#symbol_packages[@]} > 0 )); then
            dotnet nuget push "artifacts/nuget/*.snupkg" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          fi
